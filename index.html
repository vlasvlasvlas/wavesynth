<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WaveSynth — Oceanographic Wavetable & Surfing Audio Interface</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: #01060d;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }
    #ocean {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #00f5d4;
      background: rgba(2,11,20,0.88);
      padding: 14px 18px;
      border: 1px solid rgba(0,245,212,0.25);
      pointer-events: none;
      white-space: pre;
      line-height: 1.6;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      z-index: 15;
    }
    #start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(1, 6, 13, 0.94);
      backdrop-filter: blur(12px);
      z-index: 100;
    }
    #start-title {
      font-family: 'Courier New', monospace;
      font-size: 28px;
      color: #00f5d4;
      letter-spacing: 10px;
      font-weight: bold;
      text-shadow: 0 0 24px rgba(0,245,212,0.45);
    }
    #start {
      background: rgba(0,245,212,0.08);
      border: 1.5px solid #00f5d4;
      color: #00f5d4;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: bold;
      padding: 12px 36px;
      cursor: pointer;
      letter-spacing: 3px;
      margin-top: 14px;
      transition: all 0.25s ease;
      box-shadow: 0 0 15px rgba(0,245,212,0.2);
    }
    #start:hover, #start:active {
      background: #00f5d4;
      color: #01060d;
      box-shadow: 0 0 25px rgba(0,245,212,0.6);
    }
    #hint {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #00f5d4;
      background: rgba(2,11,20,0.85);
      border: 1px solid rgba(0,245,212,0.3);
      padding: 6px 16px;
      pointer-events: none;
      white-space: nowrap;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    input[type=range] {
      -webkit-appearance: none;
      height: 4px;
      background: #1a4a6b;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00f5d4;
      cursor: pointer;
      box-shadow: 0 0 8px #00f5d4;
    }

    /* ─── Menú Inferior Responsivo ─────────────────────────────────────────── */
    .synth-bottom-bar {
      position: absolute;
      bottom: max(14px, env(safe-area-inset-bottom, 14px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      align-items: center;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #00f5d4;
      background: rgba(2,11,20,0.94);
      padding: 9px 18px;
      border: 1px solid rgba(0,245,212,0.28);
      border-radius: 6px;
      box-shadow: 0 10px 32px rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      user-select: none;
      z-index: 25;
      max-width: 96vw;
    }

    .synth-group {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    /* Optimización para teléfonos móviles y tablets */
    @media (max-width: 768px) {
      #hud {
        top: 54px;
        left: 12px;
        right: 12px;
        max-width: calc(100vw - 24px);
        font-size: 10px;
        padding: 10px 12px;
      }
      .synth-bottom-bar {
        max-width: calc(100vw - 16px);
        padding: 6px 10px;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        justify-content: flex-start;
        scrollbar-width: none;
      }
      .synth-bottom-bar::-webkit-scrollbar {
        display: none;
      }
      .synth-bottom-bar button,
      .synth-bottom-bar select {
        touch-action: manipulation;
      }
      input[type=range]::-webkit-slider-thumb {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>
<body>
  <canvas id="ocean"></canvas>
  <div id="hud"></div>
  <div id="start-screen">
    <div id="start-title">WAVESYNTH</div>
    <button id="start">ENTRAR</button>
  </div>
  <div id="hint"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
